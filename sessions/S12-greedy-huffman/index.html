  <!-- Unified library — stage-scoped interactive demos. The Huffman initial box
       takes any of four inputs, and every build reports ASCII vs fixed-length vs
       Huffman bits with the ratio:
         TEXT(the white fox …)   count real characters (lower-cased; a space is
                                 a symbol, drawn ␣, and is usually the commonest)
         SYM-FRQ(a:20, b:17, …)  symbol/frequency pairs, in the same a:5 b:9
                                 notation the slides use
         SYM-RAND(a..h)          that range with seeded SKEWED frequencies
         5, 9, 12, …             bare frequencies for a, b, c, … (as before)
         huffman-build (Part 3)  Build animates the merges. Equal frequencies
                                 ("8, 8, 8, 8") → a balanced tree = no win.
         huffman-codes (Part 4)  same engine + an Encode op: type text and watch
                                 the root-to-leaf walks assemble the bits. -->
  <script type="module">
    import { initDeckDemos, ArrayRenderer, Huffman, TreeRenderer, Intervals, IntervalRenderer } from "../../lib/deck.js";
    // Part 2: ONE interval instance, both greedies — a[1,5) b[2,6) c[3,7) d[7,9)
    // e[8,11). Rooms → 3 (= the max overlap); Select → 2 (a, d). Same picture,
    // different question, different answer: that contrast is the slide's point.
    const IVS = "1 5, 2 6, 3 7, 7 9, 8 11";
    const CLRS = "5, 9, 12, 13, 16, 45"; // a:5 b:9 c:12 d:13 e:16 f:45 → weighted total 224
    const base = () => ({
      make: () => new Huffman(),
      initial: CLRS,
      // four ways to say WHAT to compress; `raw` is the box text verbatim,
      // because parseSequence would keep only the digits
      initialPlaceholder: "TEXT(…) · SYM-FRQ(a:20, b:17) · SYM-RAND(a..h) · 5, 9, 12",
      initialTitle: "TEXT(real text) · SYM-FRQ(a:20, b:17) · SYM-RAND(a..h) · or plain frequencies for a, b, c, …",
      initialWidth: 250,
      presets: [
        { name: "CLRS classic (5,9,12,13,16,45)", initial: CLRS },
        { name: "real text — spaces and all", initial: "TEXT(the white fox jumped over the white fence by the white house)" },
        { name: "written-out pairs", initial: "SYM-FRQ(a:20, b:17, c:11, d:6, e:3)" },
        { name: "random skewed frequencies", initial: "SYM-RAND(a..h)" },
        { name: "equal frequencies — no win", initial: "8, 8, 8, 8" },
      ],
      buildAll: (s, keys, vals, method, raw) => s.buildInput(raw, keys),
      // both views at once, as the heap demos do: the ordered symbol:frequency
      // pool above (smallest first — the next merge is the leftmost two) and
      // the tree below. Frequency rides IN the node; the symbol labels leaves.
      renderer: [
        (c) => new ArrayRenderer(c, { mode: "cells", pointers: false }),
        (c) => new TreeRenderer(c, { labels: "sym" }),
      ],
      stateMsg: (s) => s.statsLine() || `Huffman trie — ${s.inorder()}`,
      chrome: { showCosts: true },
      width: 900, height: [66, 250],
    });
    initDeckDemos({
      "intervals": {
        make: () => new Intervals(),
        initial: IVS,
        initialPlaceholder: "start finish, …",
        initialTitle: "half-open intervals \"start finish\", comma-separated",
        loadRaw: true,            // Build just shows the events; the OPS are the algorithms
        renderer: (c) => new IntervalRenderer(c, { rowH: 26 }),
        stateMsg: (s) => `${s.iv.length} events — ${s.inorder()}; max overlap ${s.peakOverlap()}`,
        ops: [
          { name: "Rooms", desc: "interval partitioning: fewest rooms that host them ALL", run: (s) => s.rooms() },
          { name: "Select", desc: "activity selection: most activities in ONE room", run: (s) => s.select() },
        ],
        costs: ["compare", "write"], chrome: { showCosts: true },
        width: 860, height: 210,
      },
      "huffman-build": { ...base(), costs: ["compare", "link", "alloc"] },
      "huffman-codes": { ...base(), costs: ["compare", "write"],
        valPlaceholder: "text to encode",
        ops: [{ name: "Encode", arg: "string", run: (s, v) => s.codesWalk(v) }] },
    });
  </script>
